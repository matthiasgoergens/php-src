# Internal check on the fork only: build PHP on the Windows runner used by the
# php-src master matrix and run just ext/standard/tests/file/bug81145.phpt.
name: internal-win-bug81145
on:
  push:
    branches:
      - 'ci-bug81145-windows*'
  workflow_dispatch: ~
permissions:
  contents: read
jobs:
  WINDOWS_X64_ZTS:
    name: WINDOWS_X64_ZTS (bug81145 only)
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
      PHP_BUILD_OBJ_DIR: C:\obj
      PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
      PHP_BUILD_SDK_BRANCH: php-sdk-2.8.2
      PHP_BUILD_CRT: vs18
      PLATFORM: x64
      THREAD_SAFE: "1"
      INTRINSICS: "AVX2"
      PARALLEL: ""
      OPCACHE: "1"
      ASAN: "0"
      CLANG_TOOLSET: "0"
    steps:
      - name: git config
        run: git config --global core.autocrlf false && git config --global core.eol lf
      - name: git checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup-windows
      - name: Build
        run: .github/scripts/windows/build.bat
      - name: Test
        run: .github/scripts/windows/test.bat
